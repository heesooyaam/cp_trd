name: C++20 reference checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-lang-cyrillic cm-super poppler-utils bc
      - name: Build PDF
        run: make kactl
      - name: Save PDF
        uses: actions/upload-artifact@v4
        with:
          name: cp_trd
          path: kactl.pdf
      - name: Compile headers in C++20
        run: make test-compiles
      - name: Run stress tests in C++20
        run: make test
      - name: Sanitizers for new code
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer stress-tests/team/Reference.cpp -o /tmp/team-tests
          /tmp/team-tests
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer stress-tests/team/Structures.cpp -o /tmp/structure-tests
          /tmp/structure-tests
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer stress-tests/team/DiophantineDynamic.cpp -o /tmp/dio-dynamic-tests
          /tmp/dio-dynamic-tests
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer stress-tests/team/PruferRoman.cpp -o /tmp/prufer-roman-tests
          /tmp/prufer-roman-tests
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer stress-tests/team/Int64Template.cpp -o /tmp/int64-template-tests
          /tmp/int64-template-tests
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer stress-tests/team/DSUXor.cpp -o /tmp/dsu-xor-tests
          /tmp/dsu-xor-tests
      - name: Check pragma examples
        run: |
          for mode in 0 1 2 3; do
            g++ -std=c++20 -O2 -Wall -Wextra -Werror -DCP_BITSET_MODE=$mode doc/benchmarks/bitset.cpp -o /tmp/bitset-$mode
          done
          if grep -qw avx2 /proc/cpuinfo && grep -qw popcnt /proc/cpuinfo; then
            for mode in 0 1 2 3; do /tmp/bitset-$mode 1000 > /tmp/result-$mode; done
            for mode in 1 2 3; do cmp /tmp/result-0 /tmp/result-$mode; done
          fi
      - name: Enforce 25 pages plus cover
        run: |
          pages=$(pdfinfo kactl.pdf | awk '/^Pages:/ {print $2}')
          echo "PDF pages including cover: $pages"
          test "$pages" -le 26
